<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d10" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>VoxelTest — Phase 1</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="stats"></div>
    </div>

    <canvas id="minimap" width="180" height="180" aria-label="Minimap"></canvas>

    <div id="dpad" aria-label="Movement pad">
      <button class="dpad-btn dpad-diag" data-dirs="up,left" aria-label="Up-left">↖</button>
      <button class="dpad-btn" data-dirs="up" aria-label="Up">▲</button>
      <button class="dpad-btn dpad-diag" data-dirs="up,right" aria-label="Up-right">↗</button>
      <button class="dpad-btn" data-dirs="left" aria-label="Left">◀</button>
      <button class="dpad-btn dpad-center" aria-hidden="true" tabindex="-1"></button>
      <button class="dpad-btn" data-dirs="right" aria-label="Right">▶</button>
      <button class="dpad-btn dpad-diag" data-dirs="down,left" aria-label="Down-left">↙</button>
      <button class="dpad-btn" data-dirs="down" aria-label="Down">▼</button>
      <button class="dpad-btn dpad-diag" data-dirs="down,right" aria-label="Down-right">↘</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
